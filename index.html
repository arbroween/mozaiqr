<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1" />
    <title>MozaiQR</title>
    <link rel="stylesheet" href="./styles/index.css" />
  </head>
  <body>
    <h1>MozaiQR</h1>
    <div class="container">
      <label for="text">URL</label>
      <input type="text" id="text" placeholder="https://example.com" />
      <label for="file-zone">Image</label>
      <label id="file-zone">
        Cliquer pour choisir une image ou la glisser ici
        <input type="file" id="file-upload" accept="image/png, image/jpeg" />
      </label>
      <label for="correction-level">Niveau de correction</label>
      <select id="correction-level">
        <option value="L">L</option>
        <option value="M" selected>M</option>
        <option value="Q">Q</option>
        <option value="H">H</option>
      </select>
      <button id="submit">Générer le code QR</button>
    </div>
    <div id="output"></div>
    <footer>
      <p>© 2026 Arbroween</p>
    </footer>
    <script type="module" src="./scripts/index.js"></script>
  </body>
</html>
